<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AÖO Başarı İstasyonu | Hata Defteri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- Service Worker Kaydı -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker Aktif:', reg.scope))
            .catch((err) => console.log('Service Worker Hatası:', err));
        });
      }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- HEADER / NAVIGATION (hata_defteri.html için) -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">AÖO Başarı İstasyonu</h1>
                        <p class="text-xs text-slate-400 font-medium">Öğrenci: <span class="text-brand-400 font-semibold">Ahmet Ensar</span></p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Bildirim İzin Butonu -->
                    <button id="notifBtn" onclick="requestNotificationPermission()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-brand-400 border border-brand-500/30 transition-all">
                        <i class="fa-solid fa-bell"></i> <span id="notifBtnText">Bildirimleri Aç</span>
                    </button>

                    <nav class="hidden md:flex items-center gap-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                        <a href="takvim.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"><i class="fa-regular fa-calendar-check"></i> Takvim</a>
                        <a href="deneme.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"><i class="fa-solid fa-chart-line"></i> Deneme</a>
                        <a href="hata_defteri.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-400 bg-brand-500/10 border border-brand-500/20"><i class="fa-solid fa-book-bookmark"></i> Hata Defteri</a>
                        <a href="pomodoro.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"><i class="fa-solid fa-clock"></i> Pomodoro</a>
                        <a href="ozet.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"><i class="fa-solid fa-sliders"></i> İstatistik</a>
                    </nav>
                </div>
            </div>
        </div>

        <div class="md:hidden flex border-t border-slate-800/80 bg-slate-900 px-1 py-1.5 justify-around">
            <a href="takvim.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg"><i class="fa-regular fa-calendar-check text-sm"></i> Takvim</a>
            <a href="deneme.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg"><i class="fa-solid fa-chart-line text-sm"></i> Deneme</a>
            <a href="hata_defteri.html" class="flex flex-col items-center gap-0.5 text-brand-400 text-[10px] font-medium py-1 px-2 rounded-lg"><i class="fa-solid fa-book-bookmark text-sm"></i> Hata</a>
            <a href="pomodoro.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg"><i class="fa-solid fa-clock text-sm"></i> Pomodoro</a>
            <a href="ozet.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg"><i class="fa-solid fa-chart-pie text-sm"></i> İstatistik</a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Form: Add New Error -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-sm font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-plus-circle text-rose-400"></i> Yeni Yanlış/Boş Soru Ekle
                </h2>

                <form id="addErrorForm" onsubmit="handleAddError(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Ders Seçimi</label>
                        <select id="errSubject" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                            <option value="Türkçe">Türkçe</option>
                            <option value="Matematik">Matematik</option>
                            <option value="Fen Bilimleri">Fen Bilimleri</option>
                            <option value="Sosyal Bilgiler">Sosyal Bilgiler / İnkılap</option>
                            <option value="İngilizce">İngilizce</option>
                            <option value="Din Kültürü">Din Kültürü</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Kaynak / Deneme</label>
                            <input type="text" id="errSource" placeholder="Örn: 1. Deneme" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Konu / Soru No</label>
                            <input type="text" id="errTopic" placeholder="Örn: Paragraf S.4" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Hata Sebebi</label>
                        <select id="errReason" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                            <option value="Dikkat / Okuma Hatası">🔴 Dikkat / Okuma Hatası</option>
                            <option value="Konu / Bilgi Eksiği">🟡 Konu / Bilgi Eksiği</option>
                            <option value="Bilgi / Kavram Unutma">🟣 Bilgi / Kavram Unutma</option>
                            <option value="Zaman Yetmedi / Yavaşlık">🔵 Zaman Yetmedi / Yavaşlık</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Doğru Çözüm & Püf Noktası</label>
                        <textarea id="errSolution" rows="3" placeholder="Sorunun doğru mantığı neymiş? Bir daha yapmamak için not al..." required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bookmark"></i> Hata Defterine Kaydet
                    </button>
                </form>
            </div>

            <!-- Right List: Error Log & Filtering -->
            <div class="lg:col-span-2 space-y-4">
                <!-- Filters & Search -->
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="relative w-full sm:w-64">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                        <input type="text" id="searchError" oninput="renderErrorList()" placeholder="Hata ara (konu, çözüm)..."
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <select id="filterErrSubject" onchange="renderErrorList()" class="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-xl px-3 py-1.5 focus:outline-none">
                            <option value="all">Tüm Dersler</option>
                            <option value="Türkçe">Türkçe</option>
                            <option value="Matematik">Matematik</option>
                            <option value="Fen Bilimleri">Fen Bilimleri</option>
                            <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                            <option value="İngilizce">İngilizce</option>
                            <option value="Din Kültürü">Din Kültürü</option>
                        </select>
                    </div>
                </div>

                <!-- Error Items Container -->
                <div id="errorItemsContainer" class="space-y-3 max-h-[550px] overflow-y-auto pr-1">
                    <!-- JS ile doldurulacak -->
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-4 text-center text-xs text-slate-500">
        <p>AÖO Çalışma ve Başarı İstasyonu &copy; 2026 - 2027 | Ahmet Ensar</p>
    </footer>

    <script>
        let errorsData = JSON.parse(localStorage.getItem("aoo_errors_data")) || [];

        // BİLDİRİM FONKSİYONLARI
        function sendPWANotification(title, body, tag = 'general', url = '/hata_defteri.html') {
            if (Notification.permission === 'granted') {
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'SHOW_NOTIFICATION',
                        title: title,
                        body: body,
                        tag: tag,
                        url: url
                    });
                } else {
                    new Notification(title, { body: body, icon: '/android-chrome-192x192.png' });
                }
            }
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Tarayıcınız bildirim özelliğini desteklemiyor.");
                return;
            }

            Notification.requestPermission().then((permission) => {
                updateNotifButtonUI();
                if (permission === "granted") {
                    sendPWANotification(
                        "Başarı İstasyonu 🚀",
                        "Bildirimler aktif edildi! Hata defterine soru eklediğinde sana haber vereceğiz.",
                        "welcome-hata"
                    );
                } else if (permission === "denied") {
                    alert("Bildirim izni engellendi. Telefon/Tarayıcı ayarlarından izin verebilirsin.");
                }
            });
        }

        function updateNotifButtonUI() {
            const btnText = document.getElementById("notifBtnText");
            const btn = document.getElementById("notifBtn");
            if (!btnText || !btn) return;

            if (!("Notification" in window)) {
                btnText.innerText = "Desteklenmiyor";
                return;
            }

            if (Notification.permission === "granted") {
                btnText.innerText = "Bildirimler Açık";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-semibold cursor-default";
            } else if (Notification.permission === "denied") {
                btnText.innerText = "Bildirim Kapalı";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/30 text-xs font-semibold cursor-pointer";
            } else {
                btnText.innerText = "Bildirimleri Aç";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-brand-400 border border-brand-500/30 transition-all cursor-pointer";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderErrorList();
            updateNotifButtonUI();
        });

        function handleAddError(e) {
            e.preventDefault();
            
            const newError = {
                id: Date.now(),
                subject: document.getElementById("errSubject").value,
                source: document.getElementById("errSource").value,
                topic: document.getElementById("errTopic").value,
                reason: document.getElementById("errReason").value,
                solution: document.getElementById("errSolution").value,
                date: new Date().toLocaleDateString("tr-TR")
            };

            errorsData.unshift(newError);
            localStorage.setItem("aoo_errors_data", JSON.stringify(errorsData));

            document.getElementById("addErrorForm").reset();
            renderErrorList();

            // PWA Bildirimi Tetikle
            sendPWANotification(
                "Hata Defterine Eklendi 📝",
                `${newError.subject} - ${newError.topic} sorusu kaydedildi. Unutmamak için düzenli tekrar et!`,
                `error-add-${newError.id}`,
                '/hata_defteri.html'
            );

            alert("Hata başarıyla kaydedildi!");
        }

        function renderErrorList() {
            const container = document.getElementById("errorItemsContainer");
            const searchQuery = document.getElementById("searchError").value.toLowerCase();
            const subjectFilter = document.getElementById("filterErrSubject").value;

            container.innerHTML = "";

            const filtered = errorsData.filter(err => {
                const matchSubject = subjectFilter === "all" || err.subject === subjectFilter;
                const matchSearch = err.topic.toLowerCase().includes(searchQuery) || 
                                    err.solution.toLowerCase().includes(searchQuery) || 
                                    err.source.toLowerCase().includes(searchQuery);
                return matchSubject && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-xs">
                        <i class="fa-solid fa-folder-open text-2xl mb-2 text-slate-600"></i>
                        <p>Kayıtlı hata bulunamadı ya da arama kriterine uygun sonuç yok.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(err => {
                let badgeColor = "bg-brand-500/10 text-brand-400 border-brand-500/20";
                if (err.reason.includes("Dikkat")) badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                else if (err.reason.includes("Konu")) badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                else if (err.reason.includes("Bilgi")) badgeColor = "bg-purple-500/10 text-purple-400 border-purple-500/20";
                else if (err.reason.includes("Zaman")) badgeColor = "bg-cyan-500/10 text-cyan-400 border-cyan-500/20";

                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 transition hover:border-slate-700";
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="bg-slate-800 text-slate-200 text-[11px] font-bold px-2.5 py-0.5 rounded-lg">${err.subject}</span>
                            <span class="text-slate-400 text-[11px]"><i class="fa-solid fa-bookmark mr-1"></i>${err.source} - ${err.topic}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-500">${err.date}</span>
                            <button onclick="deleteError(${err.id})" class="text-slate-500 hover:text-rose-400 transition text-xs p-1" title="Sil">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-lg border ${badgeColor}">${err.reason}</span>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-xs text-slate-300 space-y-1">
                        <p class="font-semibold text-slate-400 text-[10px] uppercase tracking-wider">Doğru Çözüm / Püf Noktası:</p>
                        <p>${err.solution}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteError(id) {
            if (confirm("Bu hata kaydını silmek istediğine emin misin?")) {
                errorsData = errorsData.filter(item => item.id !== id);
                localStorage.setItem("aoo_errors_data", JSON.stringify(errorsData));
                renderErrorList();
            }
        }
    </script>
</body>
</html>
