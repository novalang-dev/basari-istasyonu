    <!-- Tailwind CSS CDN -->

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {

                            50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e',

    <!-- FontAwesome Icons -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker Aktif:', reg.scope))
            .catch((err) => console.log('Service Worker Hatası:', err));
        });
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Title -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">
                            AÖO Başarı İstasyonu
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">Öğrenci: <span class="text-brand-400 font-semibold">Ahmet Ensar</span></p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Bildirim İzin Butonu (Push Abonelik) -->
                    <button id="notifBtn" onclick="subscribeToPush()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-brand-400 border border-brand-500/30 transition-all">
                        <i class="fa-solid fa-bell"></i> <span id="notifBtnText">Bildirimleri Aç</span>
                    </button>

                    <!-- Desktop Nav -->
                    <nav class="hidden md:flex items-center gap-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                        <a href="takvim.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                            <i class="fa-regular fa-calendar-check"></i> Takvim
                        </a>
                        <a href="deneme.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                            <i class="fa-solid fa-chart-line"></i> Deneme
                        </a>
                        <a href="hata_defteri.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                            <i class="fa-solid fa-book-bookmark"></i> Hata Defteri
                        </a>
                        <a href="pomodoro.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-brand-400 bg-brand-500/10 border border-brand-500/20">
                            <i class="fa-solid fa-clock"></i> Pomodoro
                        </a>
                        <a href="ozet.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                            <i class="fa-solid fa-sliders"></i> İstatistik
                        </a>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Mobile Bottom Nav Bar -->
        <div class="md:hidden flex border-t border-slate-800/80 bg-slate-900 px-1 py-1.5 justify-around">
            <a href="takvim.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg">
                <i class="fa-regular fa-calendar-check text-sm"></i> Takvim
            </a>
            <a href="deneme.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg">
                <i class="fa-solid fa-chart-line text-sm"></i> Deneme
            </a>
            <a href="hata_defteri.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg">
                <i class="fa-solid fa-book-bookmark text-sm"></i> Hata
            </a>
            <a href="pomodoro.html" class="flex flex-col items-center gap-0.5 text-brand-400 text-[10px] font-medium py-1 px-2 rounded-lg">
                <i class="fa-solid fa-clock text-sm"></i> Pomodoro
            </a>
            <a href="ozet.html" class="flex flex-col items-center gap-0.5 text-slate-400 text-[10px] font-medium py-1 px-2 rounded-lg">
                <i class="fa-solid fa-chart-pie text-sm"></i> İstatistik
            </a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center items-center space-y-6">

        <!-- Pomodoro Card Wrapper -->
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl w-full text-center space-y-6 shadow-2xl">
            <!-- Mode Switcher Tabs -->
            <div class="flex justify-center gap-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                <button onclick="switchMode('work')" id="mode-work" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-brand-600 text-white shadow-md">
                    Çalışma (25d)
                </button>
                <button onclick="switchMode('shortBreak')" id="mode-shortBreak" class="flex-1 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white">
                    Kısa Mola (5d)
                </button>
                <button onclick="switchMode('longBreak')" id="mode-longBreak" class="flex-1 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white">
                    Uzun Mola (15d)
                </button>
            </div>

            <!-- Timer Display -->
            <div class="py-2">
                <div id="timerDisplay" class="text-6xl sm:text-7xl font-black font-mono tracking-wider text-white">
                    25:00
                </div>
                <p id="timerStatusText" class="text-xs text-slate-400 mt-2 font-medium">Odaklanma Zamanı 🚀</p>
            </div>

            <!-- Custom Time Input Section -->
            <div class="flex items-center justify-center gap-2 pt-3 border-t border-slate-800/80">
                <span class="text-xs text-slate-400 font-medium">Özel Süre (Dakika):</span>
                <input type="number" id="customMinInput" min="1" max="180" value="25" 
                    class="w-16 bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-center text-slate-200 focus:outline-none focus:border-brand-500">
                <button onclick="applyCustomTime()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3.5 py-1.5 rounded-xl transition border border-slate-700">
                    Ayarla
                </button>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-3 pt-2">
                <button id="startPauseBtn" onclick="toggleTimer()" class="bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm px-8 py-3 rounded-2xl transition shadow-lg shadow-brand-600/30 flex items-center gap-2">
                    <i id="startPauseIcon" class="fa-solid fa-play"></i> <span id="startPauseLabel">Başlat</span>
                </button>
                <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm px-5 py-3 rounded-2xl transition border border-slate-700" title="Sıfırla">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Stats Card -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl w-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <div class="text-left">
                    <p class="text-[11px] text-slate-400">Tamamlanan Pomodoro</p>
                    <h3 id="completedCountLabel" class="text-base font-bold text-white">0 Seans</h3>
                </div>
            </div>
            <button onclick="resetStats()" class="text-xs text-slate-500 hover:text-rose-400 transition">Sıfırla</button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-4 text-center text-xs text-slate-500">
        <p>AÖO Çalışma ve Başarı İstasyonu &copy; 2026 - 2027 | Ahmet Ensar</p>
    </footer>

    <script>
        const TIMES = {
            work: 25 * 60,
            shortBreak: 5 * 60,
            longBreak: 15 * 60,
            custom: 25 * 60
        };

        let currentMode = 'work';
        let timeLeft = TIMES[currentMode];
        let timerId = null;
        let isRunning = false;
        let completedPomodoros = parseInt(localStorage.getItem("aoo_pomodoro_count")) || 0;

        // --- PUSH ABONELİĞİ KODLARI ---
        async function subscribeToPush() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert('Tarayıcınız push bildirimlerini desteklemiyor.');
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('Bildirim izni verilmedi.');
                updateNotifButtonUI();
                return;
            }
            try {
                const registration = await navigator.serviceWorker.ready;
                const res = await fetch('/api/vapid-public-key');
                const { publicKey } = await res.json();
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicKey)
                });
                await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        endpoint: subscription.endpoint,
                        keys: subscription.toJSON().keys,
                        device_label: /Mobi|Android/i.test(navigator.userAgent) ? 'phone' : 'desktop'
                    })
                });
                updateNotifButtonUI();
                sendPWANotification("Başarı İstasyonu 🚀", "Bildirimler aktif edildi! Pomodoro seansların bittiğinde sana bildirim göndereceğiz.", "welcome-pomodoro");
            } catch (err) {
                console.error('Abonelik hatası:', err);
                alert('Bildirimlere abone olurken bir hata oluştu.');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }

        // --- SAYFA İÇİ ANLIK BİLDİRİM FONKSİYONU ---
        function sendPWANotification(title, body, tag = 'general', url = '/pomodoro.html') {
            if (Notification.permission === 'granted') {
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'SHOW_NOTIFICATION',
                        title: title,
                        body: body,
                        tag: tag,
                        url: url
                    });
                } else {
                    new Notification(title, { body: body, icon: '/android-chrome-192x192.png' });
                }
            }
        }

        function updateNotifButtonUI() {
            const btnText = document.getElementById("notifBtnText");
            const btn = document.getElementById("notifBtn");
            if (!btnText || !btn) return;

            if (!("Notification" in window)) {
                btnText.innerText = "Desteklenmiyor";
                return;
            }

            if (Notification.permission === "granted") {
                btnText.innerText = "Bildirimler Açık";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-semibold cursor-default";
            } else if (Notification.permission === "denied") {
                btnText.innerText = "Bildirim Kapalı";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/30 text-xs font-semibold cursor-pointer";
            } else {
                btnText.innerText = "Bildirimleri Aç";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-brand-400 border border-brand-500/30 transition-all cursor-pointer";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            updateDisplay();
            updateStatsUI();
            updateNotifButtonUI();
        });

        function switchMode(mode) {
            pauseTimer();
            currentMode = mode;
            timeLeft = TIMES[mode];
            
            ['work', 'shortBreak', 'longBreak'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-brand-600 text-white shadow-md";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white";
                }
            });

            const statusText = document.getElementById("timerStatusText");
            if (mode === 'work') statusText.innerText = "Odaklanma Zamanı 🚀";
            else if (mode === 'shortBreak') statusText.innerText = "Kısa Mola & Dinlenme ☕";
            else statusText.innerText = "Uzun Mola Zamanı 🛋️";

            document.getElementById("customMinInput").value = Math.floor(TIMES[mode] / 60);
            updateDisplay();
        }

        function applyCustomTime() {
            const inputVal = parseInt(document.getElementById("customMinInput").value);
            if (isNaN(inputVal) || inputVal <= 0 || inputVal > 180) {
                alert("Lütfen 1 ile 180 arasında geçerli bir dakika girin.");
                return;
            }

            pauseTimer();
            TIMES['custom'] = inputVal * 60;
            currentMode = 'custom';
            timeLeft = TIMES['custom'];

            ['work', 'shortBreak', 'longBreak'].forEach(m => {
                document.getElementById(`mode-${m}`).className = "flex-1 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white";
            });

            document.getElementById("timerStatusText").innerText = `Özel Süre (${inputVal} Dakika) ⏱️`;
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById("startPauseLabel").innerText = "Duraklat";
            document.getElementById("startPauseIcon").className = "fa-solid fa-pause";

            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    isRunning = false;
                    document.getElementById("startPauseLabel").innerText = "Başlat";
                    document.getElementById("startPauseIcon").className = "fa-solid fa-play";
                    
                    if (currentMode === 'work' || currentMode === 'custom') {
                        completedPomodoros++;
                        localStorage.setItem("aoo_pomodoro_count", completedPomodoros);
                        updateStatsUI();

                        sendPWANotification(
                            "🍅 Pomodoro Seansı Tamamlandı!",
                            `Harika bir odaklanma seansı tamamladın Ahmet Ensar! Toplam: ${completedPomodoros} Seans. Şimdi mola vakti!`,
                            `pomodoro-complete-${Date.now()}`,
                            '/pomodoro.html'
                        );
                        alert("Tebrikler! Belirlediğin çalışma seansını tamamladın!");
                    } else {
                        sendPWANotification(
                            "⏰ Mola Süresi Bitti!",
                            "Mola süresi tamamlandı. Yeni bir Pomodoro başlatarak çalışmaya devam etme vakti!",
                            `break-complete-${Date.now()}`,
                            '/pomodoro.html'
                        );
                        alert("Mola süresi bitti! Çalışmaya geri dönme vakti.");
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerId);
            document.getElementById("startPauseLabel").innerText = "Devam Et";
            document.getElementById("startPauseIcon").className = "fa-solid fa-play";
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = TIMES[currentMode];
            document.getElementById("startPauseLabel").innerText = "Başlat";
            document.getElementById("startPauseIcon").className = "fa-solid fa-play";
            updateDisplay();
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById("timerDisplay").innerText = formatted;
            document.title = `(${formatted}) AÖO Pomodoro Odak`;
        }

        function updateStatsUI() {
            document.getElementById("completedCountLabel").innerText = `${completedPomodoros} Seans`;
        }

        function resetStats() {
            if (confirm("Tamamlanan seans sayısını sıfırlamak istiyor musun?")) {
                completedPomodoros = 0;
                localStorage.setItem("aoo_pomodoro_count", 0);
                updateStatsUI();
            }
        }
    </script>
</body>
